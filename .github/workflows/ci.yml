name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
      - 'renovate/**'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint, verify, and build
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Check out
        uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Verify commit-and-tag-version command import
        run: node scripts/verify-command-import.mjs
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
